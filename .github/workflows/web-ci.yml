name: Reusable Web CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js major version.
        required: false
        type: string
        default: "22"
      working-directory:
        description: Directory containing package.json.
        required: false
        type: string
        default: .
      lockfile:
        description: Repository-relative npm lockfile path.
        required: false
        type: string
        default: package-lock.json
      verify-script:
        description: Existing package.json script that builds and verifies the app.
        required: false
        type: string
        default: build
      output-directory:
        description: Build directory that must contain at least one file.
        required: true
        type: string
      audit-production:
        description: Fail on high-severity production dependency findings.
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: Maximum runtime for the validation job.
        required: false
        type: number
        default: 20

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.lockfile }}

      - name: Install dependencies
        run: npm ci

      - name: Run accepted-output check
        env:
          VERIFY_SCRIPT: ${{ inputs.verify-script }}
        run: npm run "$VERIFY_SCRIPT"

      - name: Verify build artifact
        env:
          OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        run: |
          test -d "$OUTPUT_DIRECTORY"
          test -n "$(find "$OUTPUT_DIRECTORY" -type f -print -quit)"

      - name: Audit production dependencies
        if: inputs.audit-production
        run: npm audit --omit=dev --audit-level=high

