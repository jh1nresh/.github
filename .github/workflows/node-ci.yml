name: Reusable Node CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js major version.
        required: false
        type: string
        default: "22"
      package-manager:
        description: Supported values are npm and pnpm.
        required: false
        type: string
        default: npm
      pnpm-version:
        description: Exact pnpm version used when package-manager is pnpm.
        required: false
        type: string
        default: "9.15.9"
      working-directory:
        description: Directory containing package.json.
        required: false
        type: string
        default: .
      lockfile:
        description: Repository-relative lockfile path used by setup-node caching.
        required: false
        type: string
        default: package-lock.json
      check-script:
        description: Existing package.json script that is the accepted-output gate.
        required: false
        type: string
        default: check
      audit-production:
        description: Fail on high-severity production dependency findings.
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: Maximum runtime for the validation job.
        required: false
        type: number
        default: 15
      job-key:
        description: Stable caller-specific key used to cancel only stale copies of this job.
        required: false
        type: string
        default: validate

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.repository }}-${{ github.ref }}-${{ inputs.job-key }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node with npm cache
        if: inputs.package-manager == 'npm'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.lockfile }}

      - name: Set up Node for pnpm
        if: inputs.package-manager == 'pnpm'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Reject unsupported package manager
        if: inputs.package-manager != 'npm' && inputs.package-manager != 'pnpm'
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          echo "Unsupported package manager: $PACKAGE_MANAGER" >&2
          exit 2

      - name: Install pnpm
        if: inputs.package-manager == 'pnpm'
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}
        run: npm install --global "pnpm@$PNPM_VERSION"

      - name: Install npm dependencies
        if: inputs.package-manager == 'npm'
        run: npm ci

      - name: Install pnpm dependencies
        if: inputs.package-manager == 'pnpm'
        run: pnpm install --frozen-lockfile

      - name: Run accepted-output check
        env:
          CHECK_SCRIPT: ${{ inputs.check-script }}
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          if [[ "$PACKAGE_MANAGER" == "pnpm" ]]; then
            pnpm run "$CHECK_SCRIPT"
          else
            npm run "$CHECK_SCRIPT"
          fi

      - name: Audit production dependencies
        if: inputs.audit-production
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          if [[ "$PACKAGE_MANAGER" == "pnpm" ]]; then
            pnpm audit --prod --audit-level high
          else
            npm audit --omit=dev --audit-level=high
          fi
